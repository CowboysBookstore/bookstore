services:
  - type: web
    name: bookstore-backend
    env: python
    plan: free
    buildCommand: cd backend && bash ../build.sh
    startCommand: cd backend && gunicorn --bind 0.0.0.0:8000 --workers 1 --access-logfile - --error-logfile - backend.wsgi:application
    numInstances: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "*"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: JWT_SIGNING_KEY
        sync: false
      - key: JWT_ACCESS_MINUTES
        value: "15"
      - key: JWT_REFRESH_DAYS
        value: "7"
      - key: JWT_ISSUER
        value: "cowboy-bookstore"
      - key: JWT_AUDIENCE
        value: "cowboy-users"
      - key: DATABASE_URL
        sync: false
      - key: SUPERUSER_NAME
        sync: false
      - key: SUPERUSER_EMAIL
        sync: false
      - key: SUPERUSER_PASSWORD
        sync: false

  - type: web
    name: bookstore-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      # Serve static assets as-is
      - type: rewrite
        source: /assets/*
        destination: /assets/*
      - type: rewrite
        source: /*.js
        destination: /*.js
      - type: rewrite
        source: /*.css
        destination: /*.css
      - type: rewrite
        source: /*.map
        destination: /*.map
      - type: rewrite
        source: /*.png
        destination: /*.png
      - type: rewrite
        source: /*.jpg
        destination: /*.jpg
      - type: rewrite
        source: /*.jpeg
        destination: /*.jpeg
      - type: rewrite
        source: /*.svg
        destination: /*.svg
      - type: rewrite
        source: /*.ico
        destination: /*.ico
      - type: rewrite
        source: /*.txt
        destination: /*.txt
      - type: rewrite
        source: /*.json
        destination: /*.json
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://bookstore-backend.onrender.com
