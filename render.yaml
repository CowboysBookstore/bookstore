services:
  - type: web
    name: bookstore-backend
    env: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt && cd backend && python manage.py migrate && python manage.py collectstatic --noinput
    startCommand: cd backend && gunicorn --bind 0.0.0.0:8000 --workers 2 core.wsgi:application
    numInstances: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "*"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: bookstore-db
          property: connectionString

  - type: web
    name: bookstore-frontend
    env: static
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://bookstore-backend.onrender.com

  - type: pserv
    name: bookstore-db
    plan: free
